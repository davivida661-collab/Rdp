
name: Windows Cloud PC - Automation Tests

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-cloud-pc-tests
  cancel-in-progress: false

jobs:
  build:
    name: Windows Server 2025 - Diagnostic System
    runs-on: windows-2025
    timeout-minutes: 360

    defaults:
      run:
        shell: pwsh

    steps:
      - name: "01 - Initialize"
        run: |
          $ErrorActionPreference = "Stop"

          New-Item -ItemType Directory -Force logs | Out-Null

          "Started: $(Get-Date -Format o)" |
            Out-File logs/status.txt -Append

          Write-Host "Windows Cloud PC iniciado."

      - name: "02 - Install AnyDesk"
        run: |
          $ErrorActionPreference = "Stop"

          if (-not (Get-Command choco.exe -ErrorAction SilentlyContinue)) {
            throw "Chocolatey nao encontrado."
          }

          choco install anydesk -y --no-progress

          if ($LASTEXITCODE -ne 0) {
            throw "Falha na instalacao do AnyDesk."
          }

      - name: "03 - Locate AnyDesk"
        id: locate
        run: |
          $paths = @(
            "${env:ProgramFiles(x86)}\AnyDesk\AnyDesk.exe",
            "$env:ProgramFiles\AnyDesk\AnyDesk.exe",
            "$env:ChocolateyInstall\lib\anydesk.install\tools\AnyDesk.exe"
          )

          $exe = $paths |
            Where-Object { Test-Path $_ } |
            Select-Object -First 1

          if (-not $exe) {
            throw "Executavel AnyDesk nao encontrado."
          }

          "ANYDESK_EXE=$exe" |
            Out-File $env:GITHUB_ENV -Append

          Write-Host "Executavel: $exe"

      - name: "04 - Start AnyDesk"
        run: |
          $ErrorActionPreference = "Stop"

          $exe = $env:ANYDESK_EXE

          $process = Get-Process AnyDesk `
            -ErrorAction SilentlyContinue

          if (-not $process) {
            Start-Process -FilePath $exe
            Start-Sleep -Seconds 10
          }

          $process = Get-Process AnyDesk `
            -ErrorAction SilentlyContinue

          if ($process) {
            foreach ($p in $process) {
              try {
                $p.PriorityClass = "High"
              } catch {
                Write-Warning "Prioridade nao alterada."
              }
            }

            Write-Host "AnyDesk iniciado."
          } else {
            Write-Warning "AnyDesk nao iniciou."
          }

      - name: "05 - System Diagnostics"
        run: |
          $os = Get-CimInstance Win32_OperatingSystem
          $cpu = Get-CimInstance Win32_Processor
          $gpu = Get-CimInstance Win32_VideoController

          Write-Host "Windows: $($os.Caption)"
          Write-Host "CPU: $($cpu.Name)"
          Write-Host "RAM total: $([math]::Round($os.TotalVisibleMemorySize / 1MB,2)) GB"

          foreach ($g in $gpu) {
            Write-Host "GPU: $($g.Name)"
          }

      - name: "06 - Power Configuration"
        run: |
          powercfg /change standby-timeout-ac 0
          powercfg /change hibernate-timeout-ac 0

          Write-Host "Configuracao de energia verificada."

      - name: "07 - Network Diagnostics"
        run: |
          $targets = @(
            "1.1.1.1",
            "8.8.8.8"
          )

          foreach ($target in $targets) {
            $result = Test-NetConnection `
              -ComputerName $target `
              -Port 443 `
              -InformationLevel Quiet

            Write-Host "$target HTTPS: $result"
          }

      - name: "08 - Monitor System"
        run: |
          $ErrorActionPreference = "Continue"

          $start = Get-Date
          $end = $start.AddMinutes(330)
          $lastReport = Get-Date

          function Log($message) {
            $line = "$(Get-Date -Format o) | $message"
            Write-Host $line
            $line | Out-File logs/monitor.txt -Append -Encoding utf8
          }

          while ((Get-Date) -lt $end) {

            # CPU
            try {
              $cpu = Get-Counter `
                '\Processor(_Total)\% Processor Time'

              $cpuValue = [math]::Round(
                $cpu.CounterSamples[0].CookedValue, 2
              )
            } catch {
              $cpuValue = -1
            }

            # RAM
            $os = Get-CimInstance Win32_OperatingSystem

            $ramFree = [math]::Round(
              $os.FreePhysicalMemory / 1MB, 2
            )

            # Disk
            $disk = Get-CimInstance Win32_LogicalDisk `
              -Filter "DeviceID='C:'"

            $diskFree = [math]::Round(
              $disk.FreeSpace / 1GB, 2
            )

            # AnyDesk process
            $anydesk = Get-Process AnyDesk `
              -ErrorAction SilentlyContinue

            if (-not $anydesk) {
              Log "AnyDesk nao esta em execucao."

              # Uma tentativa de recuperacao a cada 60 segundos
              if (((Get-Date) - $lastReport).TotalSeconds -ge 60) {
                try {
                  Start-Process -FilePath $env:ANYDESK_EXE
                  Log "Tentativa de reinicializacao executada."
                } catch {
                  Log "Falha: $($_.Exception.Message)"
                }

                $lastReport = Get-Date
              }
            }

            # Internet
            $internet = Test-NetConnection `
              1.1.1.1 -Port 443 `
              -InformationLevel Quiet `
              -WarningAction SilentlyContinue

            Log "CPU=$cpuValue% RAM_LIVRE=$ramFree GB DISCO_LIVRE=$diskFree GB INTERNET=$internet"

            Start-Sleep -Seconds 10
          }

          Log "Monitoramento concluido."

      - name: "09 - Final Report"
        if: always()
        run: |
          "Final: $(Get-Date -Format o)" |
            Out-File logs/status.txt -Append

          Get-ChildItem logs -File |
            ForEach-Object {
              Write-Host $_.Name
            }

      - name: "10 - Upload Logs"
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Windows-Cloud-PC-Logs
          path: logs/
          if-no-files-found: warn
          retention-days: 7
