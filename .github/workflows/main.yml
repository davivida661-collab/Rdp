
name: Windows Cloud PC - AnyDesk

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    name: Instalar e testar AnyDesk
    runs-on: windows-2025
    timeout-minutes: 360

    env:
      ANYDESK_PASSWORD: ${{ secrets.ANYDESK_PASSWORD }}

    steps:
      - name: Preparar ambiente
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "Windows:"
          Get-ComputerInfo |
            Select-Object WindowsProductName, WindowsVersion

          Write-Host "CPU:"
          Get-CimInstance Win32_Processor |
            Select-Object Name, NumberOfCores

          Write-Host "Memoria:"
          Get-CimInstance Win32_ComputerSystem |
            Select-Object TotalPhysicalMemory

      - name: Instalar AnyDesk
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          if (-not (Get-Command choco -ErrorAction SilentlyContinue)) {
            throw "Chocolatey nao encontrado."
          }

          choco install anydesk -y --no-progress

          $paths = @(
            "${env:ProgramFiles(x86)}\AnyDesk\AnyDesk.exe",
            "$env:ProgramFiles\AnyDesk\AnyDesk.exe",
            "$env:ChocolateyInstall\lib\anydesk.install\tools\AnyDesk.exe"
          )

          $exe = $paths |
            Where-Object { Test-Path $_ } |
            Select-Object -First 1

          if (-not $exe) {
            throw "AnyDesk.exe nao encontrado."
          }

          "ANYDESK_EXE=$exe" |
            Out-File -FilePath $env:GITHUB_ENV -Append

          Write-Host "AnyDesk instalado:"
          Write-Host $exe

          & $exe --version

      - name: Iniciar serviço e configurar senha
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $exe = $env:ANYDESK_EXE

          if ([string]::IsNullOrWhiteSpace($env:ANYDESK_PASSWORD)) {
            throw "Configure o secret ANYDESK_PASSWORD."
          }

          if ($env:ANYDESK_PASSWORD.Length -lt 12) {
            throw "Use uma senha com pelo menos 12 caracteres."
          }

          # Inicia o serviço do AnyDesk
          & $exe --start
          Start-Sleep -Seconds 10

          # Configura a senha de acesso não supervisionado
          $env:ANYDESK_PASSWORD |
            & $exe --set-password _unattended_access

          if ($LASTEXITCODE -ne 0) {
            throw "Falha ao configurar a senha do AnyDesk."
          }

          Write-Host "Senha configurada sem exibir seu conteúdo."

          # Inicia o cliente
          Start-Process -FilePath $exe
          Start-Sleep -Seconds 15

      - name: Obter ID do AnyDesk
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $exe = $env:ANYDESK_EXE

          $id = (& $exe --get-id 2>&1 |
            Out-String).Trim()

          if ([string]::IsNullOrWhiteSpace($id)) {
            throw "Nao foi possivel obter o ID do AnyDesk."
          }

          "ANYDESK_ID=$id" |
            Out-File -FilePath $env:GITHUB_ENV -Append

          Write-Host "================================"
          Write-Host " ID DO ANYDESK: $id"
          Write-Host " SENHA: configurada no GitHub Secret"
          Write-Host "================================"

      - name: Diagnóstico de conexão
        shell: pwsh
        run: |
          $ErrorActionPreference = "Continue"

          Write-Host "Processos AnyDesk:"
          Get-Process AnyDesk -ErrorAction SilentlyContinue |
            Select-Object Id, ProcessName, StartTime

          Write-Host "Status do AnyDesk:"
          & $env:ANYDESK_EXE --get-status

          Write-Host "Teste HTTPS:"
          Test-NetConnection www.google.com -Port 443 |
            Select-Object ComputerName, RemotePort, TcpTestSucceeded

          Write-Host "Disco:"
          Get-PSDrive C |
            Select-Object Used, Free

      - name: Monitorar por até 330 minutos
        shell: pwsh
        run: |
          $ErrorActionPreference = "Continue"

          $log = "$env:RUNNER_TEMP\anydesk-monitor.log"

          function Write-Log($message) {
            $line = "$(Get-Date -Format 'yyyy-MM-dd HH:mm:ss') $message"
            Add-Content -Path $log -Value $line
            Write-Host $line
          }

          $end = (Get-Date).AddMinutes(330)
          $lastRestart = (Get-Date).AddMinutes(-5)

          while ((Get-Date) -lt $end) {
            $proc = Get-Process AnyDesk -ErrorAction SilentlyContinue

            if ($proc) {
              Write-Log "AnyDesk em execução. PID: $($proc.Id)"
            }
            else {
              Write-Log "Processo AnyDesk não encontrado."

              if (((Get-Date) - $lastRestart).TotalSeconds -ge 60) {
                Write-Log "Tentando reiniciar AnyDesk."
                & $env:ANYDESK_EXE --start
                Start-Process -FilePath $env:ANYDESK_EXE
                $lastRestart = Get-Date
              }
            }

            $cpu = Get-CimInstance Win32_Processor |
              Measure-Object -Property LoadPercentage -Average

            $ram = Get-CimInstance Win32_OperatingSystem

            $usedRam = [math]::Round(
              (($ram.TotalVisibleMemorySize - $ram.FreePhysicalMemory) /
              $ram.TotalVisibleMemorySize) * 100, 1
            )

            Write-Log "CPU: $($cpu.Average)% | RAM: $usedRam%"

            Start-Sleep -Seconds 30
          }

          Write-Log "Monitoramento finalizado."

      - name: Salvar logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: anydesk-diagnostico
          path: ${{ runner.temp }}\anydesk-monitor.log
          if-no-files-found: ignore
          retention-days: 7
