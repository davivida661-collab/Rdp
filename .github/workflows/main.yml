name: CI

on: [push, workflow_dispatch]

jobs:
  setup_rdp:
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download ngrok
        run: Invoke-WebRequest https://bin.equinox.io/c/bNyj1mQVY4c/ngrok-v3-stable-windows-amd64.zip -OutFile ngrok.zip

      - name: Extract ngrok
        run: Expand-Archive ngrok.zip -DestinationPath .

      - name: Authenticate ngrok
        run: .\ngrok\ngrok.exe authtoken ${{ secrets.NGROK_AUTH_TOKEN }}
        env:
          NGROK_AUTH_TOKEN: ${{ secrets.NGROK_AUTH_TOKEN }}

      - name: Enable Terminal Services
        run: |
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0
          Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "UserAuthentication" -Value 1

      - name: Create Local User 'davi'
        run: |
          $securePassword = ConvertTo-SecureString "123456d" -AsPlainText -Force
          New-LocalUser -Name "davi" -Password $securePassword -FullName "Davi" -Description "GitHub Actions User"
          Add-LocalGroupMember -Group "Administrators" -Member "davi"

      - name: Start ngrok tunnel
        run: |
          Start-Process -FilePath ".\ngrok\ngrok.exe" -ArgumentList "tcp 3389" -NoNewWindow
          Start-Sleep -Seconds 5
          $ngrokProcess = Get-Process -Name ngrok -ErrorAction SilentlyContinue
          if ($ngrokProcess) {
            Write-Host "ngrok PID: $($ngrokProcess.Id)"
            Invoke-WebRequest -Uri "http://localhost:4040/api/tunnels" -UseBasicParsing | Select-Object -ExpandProperty Content | ConvertFrom-Json | Select-Object -ExpandProperty tunnels | ForEach-Object {
              Write-Host "ngrok tunnel URL: $($_.public_url)"
              Write-Host "tunnel_url=$($_.public_url)" >> $env:GITHUB_ENV
            }
          } else {
            Write-Error "ngrok failed to start"
            exit 1
          }

      - name: Keep job alive
        run: |
          Write-Host "RDP is ready. Connect using the ngrok tunnel URL above."
          Write-Host "Username: davi"
          Write-Host "Password: 123456d"
          while ($true) {
            Start-Sleep -Seconds 300
            Write-Host "Keeping job alive... (Ctrl+C to stop)"
          }
