
name: Windows Cloud - CI Avançado

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: windows-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Windows Runner - Diagnóstico
    runs-on: windows-latest
    timeout-minutes: 30

    env:
      PROCESSOR_COUNT: 8
      OPENGL: "1"
      MEMORY_GB: 16

    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Informações do sistema
        shell: pwsh
        run: |
          Write-Host "=== WINDOWS RUNNER ==="
          Get-ComputerInfo |
            Select-Object WindowsProductName,
              WindowsVersion, OsArchitecture

          Write-Host "=== CPU ==="
          Get-CimInstance Win32_Processor |
            Select-Object Name, NumberOfCores,
              NumberOfLogicalProcessors

          Write-Host "=== MEMÓRIA ==="
          Get-CimInstance Win32_OperatingSystem |
            Select-Object TotalVisibleMemorySize,
              FreePhysicalMemory

      - name: Verificar ambiente
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "Verificando PowerShell..."
          $PSVersionTable

          Write-Host "Verificando espaço em disco..."
          Get-PSDrive -PSProvider FileSystem

          Write-Host "Verificando conectividade..."
          Test-NetConnection github.com -Port 443

      - name: Verificar arquivos do projeto
        shell: pwsh
        run: |
          Write-Host "Arquivos disponíveis:"
          Get-ChildItem -Force

      - name: Finalizar diagnóstico
        if: always()
        shell: pwsh
        run: |
          Write-Host "Diagnóstico finalizado."
          Write-Host "Status: ${{ job.status }}"
