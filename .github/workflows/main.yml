
name: Windows Cloud PC - AnyDesk

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Instalar e configurar AnyDesk
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 360

    steps:
      - name: Verificar Windows
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "=== SISTEMA ==="
          Get-ComputerInfo |
            Select-Object WindowsProductName, WindowsVersion

          Write-Host "=== PROCESSADOR ==="
          Get-CimInstance Win32_Processor |
            Select-Object Name, NumberOfCores

          Write-Host "=== MEMORIA ==="
          Get-CimInstance Win32_ComputerSystem |
            Select-Object TotalPhysicalMemory

      - name: Instalar AnyDesk
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          if (-not (Get-Command choco -ErrorAction SilentlyContinue)) {
            throw "Chocolatey nao encontrado."
          }

          choco install anydesk -y --no-progress

          $paths = @(
            "${env:ProgramFiles(x86)}\AnyDesk\AnyDesk.exe",
            "$env:ProgramFiles\AnyDesk\AnyDesk.exe"
          )

          $exe = $paths |
            Where-Object { Test-Path $_ } |
            Select-Object -First 1

          if (-not $exe) {
            throw "AnyDesk.exe nao encontrado."
          }

          "ANYDESK_EXE=$exe" |
            Out-File $env:GITHUB_ENV -Append

          Write-Host "AnyDesk instalado:"
          Write-Host $exe

          & $exe --version

      - name: Configurar acesso remoto
        shell: pwsh
        env:
          ANYDESK_PASSWORD: ${{ secrets.ANYDESK_PASSWORD }}
        run: |
          $ErrorActionPreference = "Stop"

          $exe = $env:ANYDESK_EXE

          if ([string]::IsNullOrWhiteSpace($env:ANYDESK_PASSWORD)) {
            throw "Secret ANYDESK_PASSWORD nao configurado."
          }

          if ($env:ANYDESK_PASSWORD.Length -lt 12) {
            throw "A senha precisa ter pelo menos 12 caracteres."
          }

          Write-Host "Iniciando servico AnyDesk..."

          & $exe --start
          Start-Sleep -Seconds 10

          Write-Host "Configurando acesso nao supervisionado..."

          $env:ANYDESK_PASSWORD |
            & $exe --set-password _unattended_access

          if ($LASTEXITCODE -ne 0) {
            throw "Falha ao configurar senha."
          }

          Write-Host "Senha configurada com sucesso."

          Start-Sleep -Seconds 5

          $id = (& $exe --get-id | Out-String).Trim()

          if ([string]::IsNullOrWhiteSpace($id)) {
            throw "Nao foi possivel obter o ID do AnyDesk."
          }

          Write-Host "=============================="
          Write-Host "ANYDESK ID: $id"
          Write-Host "SENHA: configurada"
          Write-Host "=============================="

      - name: Verificar conexao
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $exe = $env:ANYDESK_EXE

          Write-Host "Versao:"
          & $exe --version

          Write-Host "Status:"
          & $exe --get-status

      - name: Salvar diagnostico
        if: always()
        shell: pwsh
        run: |
          $log = Join-Path $env:RUNNER_TEMP "anydesk-monitor.log"

          @(
            "Diagnostico AnyDesk"
            "Data: $(Get-Date)"
            "Windows: $([Environment]::OSVersion.Version)"
            "AnyDesk: $($env:ANYDESK_EXE)"
          ) | Out-File $log

      - name: Upload diagnostico
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: anydesk-diagnostico
          path: ${{ runner.temp }}/anydesk-monitor.log
          if-no-files-found: warn
          retention-days: 7
