
name: Windows Cloud Runner - Diagnostico

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    name: Inicializar Windows Server 2025
    runs-on: windows-2025
    timeout-minutes: 15

    steps:
      - name: Verificar runner
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "=== RUNNER GITHUB ==="
          Write-Host "Sistema: $env:RUNNER_OS"
          Write-Host "Arquitetura: $env:RUNNER_ARCH"
          Write-Host "Nome: $env:RUNNER_NAME"

          Write-Host "=== WINDOWS ==="
          Get-ComputerInfo |
            Select-Object WindowsProductName, WindowsVersion

          Write-Host "=== CPU ==="
          Get-CimInstance Win32_Processor |
            Select-Object Name, NumberOfCores,
              NumberOfLogicalProcessors

          Write-Host "=== MEMORIA ==="
          $ram = Get-CimInstance Win32_ComputerSystem
          Write-Host ("RAM: {0:N2} GB" -f
            ($ram.TotalPhysicalMemory / 1GB))

          Write-Host "=== DISCO ==="
          Get-PSDrive C |
            Select-Object Name, Used, Free

      - name: Verificar Chocolatey
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          if (Get-Command choco -ErrorAction SilentlyContinue) {
            choco --version
          } else {
            Write-Host "Chocolatey nao encontrado."
          }

      - name: Instalar AnyDesk
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          if (-not (Get-Command choco -ErrorAction SilentlyContinue)) {
            throw "Chocolatey nao esta disponivel."
          }

          choco install anydesk -y --no-progress

          $paths = @(
            "${env:ProgramFiles(x86)}\AnyDesk\AnyDesk.exe",
            "$env:ProgramFiles\AnyDesk\AnyDesk.exe"
          )

          $exe = $paths |
            Where-Object { Test-Path $_ } |
            Select-Object -First 1

          if (-not $exe) {
            throw "Executavel AnyDesk nao encontrado."
          }

          Write-Host "AnyDesk instalado."
          & $exe --version

      - name: Gerar diagnostico
        if: always()
        shell: pwsh
        run: |
          $path = Join-Path $env:RUNNER_TEMP "diagnostico.txt"

          @(
            "Diagnostico Windows"
            "Data: $(Get-Date -Format o)"
            "Runner: $env:RUNNER_NAME"
            "Sistema: $env:RUNNER_OS"
            "Arquitetura: $env:RUNNER_ARCH"
          ) | Out-File -FilePath $path -Encoding utf8

      - name: Salvar logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-diagnostico
          path: ${{ runner.temp }}/diagnostico.txt
          if-no-files-found: warn
          retention-days: 7
